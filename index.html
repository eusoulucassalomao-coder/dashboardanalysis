<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard Pro - MVP</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e11;
            font-family: 'Inter', sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0e11;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f0b90b;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loader" class="overlay">
        <h1>Cargando Dashboard Pro...</h1>
    </div>

    <!-- NOTA: Reemplaza 'TU_URL_DE_STREAMLIT_AQUI' con la URL real después de subir a Streamlit Cloud -->
    <iframe
        src="TU_URL_DE_STREAMLIT_AQUI"
        allow="camera;microphone;geolocation"
        onload="document.getElementById('loader').classList.add('hidden')"
    ></iframe>
</body>
</html>
